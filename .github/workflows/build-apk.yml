name: Build Forge AI Studio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Forge AI Studio
        run: |
          unzip -o ForgeAIStudio-android-mvp.zip
          ls -la ForgeAIStudio

      - name: Show ReplicateClient error area
        run: |
          echo "===== ReplicateClient.kt lines 110-140 ====="
          nl -ba ForgeAIStudio/app/src/main/java/com/forgeai/studio/ReplicateClient.kt | sed -n '110,140p'

      - name: Fix Java 17 compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("ForgeAIStudio/app/build.gradle.kts")
          text = path.read_text()

          if "compileOptions {" not in text:
              text = text.replace(
                  "    buildFeatures {",
                  """    compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }

                  buildFeatures {"""
              )

          path.write_text(text)
          print(path.read_text())
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: ForgeAIStudio
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ForgeAIStudio-debug-apk
          path: ForgeAIStudio/app/build/outputs/apk/debug/app-debug.apk