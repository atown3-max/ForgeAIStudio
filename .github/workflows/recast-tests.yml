name: Recast worker tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r recast-worker/requirements-test.txt
      - run: python -m pytest recast-worker/tests -q
